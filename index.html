    .card { background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: var(--shadow-sm); }

  </style>
</head>

  <script>
    // ==========================================
    // 🛠️ GOOGLE SHEETS API V4 設定
    // ==========================================
    const CONFIG = {

      DETAIL_SPREADSHEET_ID: "1d_VIQGF3QftLt0kGPsgNnFS6JnM7wUMJECPz6cqrAXo",
      DETAIL_RANGE: "施工紀錄明細表!A:ZZ",
      WORK_ORDERS_SPREADSHEET_ID: "1gLn5Tz-TcP8LELMNH6HxkLEa67DLWYX0Uhx4oNZvmIY",
      WORK_ORDERS_RANGE: "工作表1!A:ZZ",
      API_KEY: "AIzaSyA8Ok4r6-w8Ggii57gjPafEROlninDL6sg"
    };
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8J8wBMI4feKyITveSOTNfTUz0jNimhB2TmxXR0KnLGw458FenqFYDMqY3p2fmIR2_sA/exec";
    // ==========================================

    let globalData = [];
    let globalWorkOrdersByRoadCaseNo = {}; // key: 路權案件編號 -> array of work orders
    let currentFilteredData = [];   
    let selectedAlerts = new Set(); 
    let selectedYears = new Set();  
    let selectedTypes = new Set();

    let selectedContractors = new Set();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value ?? ''), window.location.href);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch (_) { return ''; }
    }

    function parseTaiwanDate(dateStr) {
      if (!dateStr) return null;
      let str = String(dateStr).trim();

      const twMatch = str.match(/(\d+)年(\d+)月(\d+)日?/);
      if (twMatch) {
        let y = parseInt(twMatch[1], 10);
        if (y < 1911) y += 1911; 
        let m = parseInt(twMatch[2], 10) - 1; 
        let d = parseInt(twMatch[3], 10);
        return new Date(y, m, d);
      }

      str = str.replace(/[-\.]/g, '/').replace(/\s+/g, '');
      if (/^\d{6,8}$/.test(str)) {
        let yLen = str.length >= 7 ? str.length - 4 : 2; 
        let y = parseInt(str.substring(0, yLen), 10);
        if (y < 1911) y += 1911;
        let m = parseInt(str.substring(yLen, yLen+2), 10) - 1; 
        let d = parseInt(str.substring(yLen+2, yLen+4), 10);
        return new Date(y, m, d);
      }
      
      let parts = str.split('/');
      if (parts.length >= 3) {
        let y = parseInt(parts[0], 10);
        if (y < 1911) y += 1911; 
        let m = parseInt(parts[1], 10) - 1;
        let d = parseInt(parts[2], 10);
        return new Date(y, m, d);
      }
      
      let fb = new Date(dateStr);
      return isNaN(fb.getTime()) ? null : fb;
    }

    // 🚀 解析 Google Sheets 的 HYPERLINK 公式以還原連結與標籤值
    function parseHyperlink(formula) {
      if (!formula) return { url: '', label: '' };
      const str = String(formula).trim();
      const match = str.match(/=HYPERLINK\("([^"]+)"\s*,\s*"([^"]+)"\)/i);
      if (match) {
        return { url: match[1], label: match[2] };
      }
      return { url: '', label: str };
    }

    // 🚀 將 Google Sheets Date 序號數字轉換成民國年日期格式
    function formatGoogleSerialDate(serial) {
      const num = Number(serial);
      if (isNaN(num)) return String(serial).trim();
      
      const origin = new Date(Date.UTC(1899, 11, 30));
      const targetDate = new Date(origin.getTime() + num * 24 * 60 * 60 * 1000);
      
      let year = targetDate.getUTCFullYear();
      const month = targetDate.getUTCMonth() + 1;
      const day = targetDate.getUTCDate();
      
      let rocYear = year;
      if (year >= 1911) {
          rocYear = year - 1911;
      }
      
      const paddedYear = String(rocYear).padStart(4, '0');
      const paddedMonth = String(month).padStart(2, '0');
      const paddedDay = String(day).padStart(2, '0');
      
      return `${paddedYear}年${paddedMonth}月${paddedDay}日`;
    }

    // 🚀 清洗並解碼日期欄位值
    function cleanDateVal(val) {
      if (!val) return '';
      let str = String(val).trim();
      if (str.startsWith("=")) {
          str = parseHyperlink(str).label;
      }
      if (/^-?\d+$/.test(str)) {
          return formatGoogleSerialDate(str);
      }
      return str;
    }

    // 🚀 從 RD1 備註文字中提取路權案件編號
    function extractRoadCaseNo(rd1Note) {
      if (!rd1Note) return null;
      const str = String(rd1Note).trim();
      if (!str || str === '---' || str.toLowerCase() === 'null') return null;
      const m10 = str.match(/\b\d{10}\b/);
      if (m10) return m10[0];
      const appNoMatch = str.match(/AppNo=([A-Za-z0-9]+)/i);
      if (appNoMatch) return appNoMatch[1];
      if (str.length === 10) return str;
      return null;
    }

    // 🚀 格式化子列明細與關聯工單 HTML
    function formatChildRow(d) {
        const details = globalDetailData[d.caseNoRaw] || [];
        const workOrders = globalWorkOrdersByRoadCaseNo[d.caseNoRaw] || [];
        
        let html = `
          <div style="padding:15px; background:var(--color-background-secondary); border-radius:8px; border: 1px solid var(--color-border-primary); margin: 5px 10px; display:flex; flex-direction:column; gap:16px; align-items:flex-start;">
            <!-- 🔗 系統快捷按鈕 -->
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--color-background-primary); padding:8px 12px; border-radius:6px; border:1px solid var(--color-border-tertiary); width: fit-content;">
              <span style="font-size:13px; font-weight:700; color:var(--color-text-primary);">快捷連結：</span>
              <a href="https://pwd.yunlin.gov.tw/YLPipe/CaseState?AppNo=${encodeURIComponent(d.caseNoRaw)}" target="_blank" rel="noopener noreferrer" class="road-link-pill">
                🔗 歷程

    let globalDetailData = {}; // 儲存案件打卡歷史明細

    async function fetchCloudSheetsData() {
      const password = prompt("🔐 請輸入網頁瀏覽密碼：");
      if (!password) {
        document.getElementById('loading-indicator').innerHTML = `❌ <b>拒絕存取</b>：必須輸入密碼才能檢視路權資訊。`;
        document.getElementById('loading-indicator').style.background = 'var(--color-background-danger)';
        document.getElementById('loading-indicator').style.color = 'var(--color-text-danger)';
        return;
      }

      if (CONFIG.API_KEY.includes("請在此填寫你的_API_KEY")) {
        document.getElementById('loading-indicator').innerHTML = `⚠️ <b>參數尚未設定完成</b>：請先填入您的 GCP API 金鑰。`;
        return;
      }
      
      const masterUrl = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.MASTER_SPREADSHEET_ID}/values/${encodeURIComponent(CONFIG.MASTER_RANGE)}?key=${CONFIG.API_KEY}&valueRenderOption=FORMULA`;
      const detailUrl = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.DETAIL_SPREADSHEET_ID}/values/${encodeURIComponent(CONFIG.DETAIL_RANGE)}?key=${CONFIG.API_KEY}&valueRenderOption=FORMULA`;
      const workOrdersUrl = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.WORK_ORDERS_SPREADSHEET_ID}/values/${encodeURIComponent(CONFIG.WORK_ORDERS_RANGE)}?key=${CONFIG.API_KEY}`;

      try {
        // 同時抓取主檔、打卡明細檔與工作單檔
        const [masterRes, detailRes, workOrdersRes] = await Promise.all([
            fetch(masterUrl).then(r => r.json()),
            fetch(detailUrl).then(r => r.json()),
            fetch(workOrdersUrl).then(r => r.json())
        ]);

        if (masterRes.error) throw new Error("主檔讀取失敗: " + masterRes.error.message);
        if (detailRes.error) throw new Error("明細檔讀取失敗: " + detailRes.error.message);
        if (workOrdersRes.error) throw new Error("工作單試算表讀取失敗: " + workOrdersRes.error.message);

        // --- 0. 解析工作單 (Work Orders Sheet: 1gLn5Tz-TcP8LELMNH6HxkLEa67DLWYX0Uhx4oNZvmIY) ---
        const woValues = workOrdersRes.values || [];
        globalWorkOrdersByRoadCaseNo = {};
        if (woValues.length > 1) {
            const woHeaders = woValues[0].map(h => h ? String(h).trim() : '');
            let woIdxEngNo = woHeaders.indexOf('工程編號_x');
            if (woIdxEngNo === -1) woIdxEngNo = woHeaders.indexOf('工程編號');
            if (woIdxEngNo === -1) woIdxEngNo = woHeaders.findIndex(h => h.includes('工程編號'));

            let woIdxId = woHeaders.indexOf('工作單流水號');
            if (woIdxId === -1) woIdxId = woHeaders.indexOf('工作單編號');
            if (woIdxId === -1) woIdxId = woHeaders.findIndex(h => h.includes('工作單'));
            const woIdxStatus = woHeaders.indexOf('回報狀態');
            const woIdxLoc = woHeaders.indexOf('施工地點');
            const woIdxRd1Note = woHeaders.indexOf('RD1備註');
            
            let woIdxPcdNote = woHeaders.indexOf('PCD施工備註');
            if (woIdxPcdNote === -1) {
                woIdxPcdNote = woHeaders.findIndex(h => h.includes('PCD') || h.includes('施工備註'));
            }
            if (woIdxPcdNote === -1 && woHeaders.length > 11) {
                woIdxPcdNote = 11;
            }

            woValues.slice(1).forEach(row => {
                const getCell = idx => (idx !== -1 && idx < row.length && row[idx] !== undefined) ? String(row[idx]).trim() : '';
                const rd1Note = getCell(woIdxRd1Note);
                const roadCaseNo = extractRoadCaseNo(rd1Note);
                if (!roadCaseNo) return;

                if (!globalWorkOrdersByRoadCaseNo[roadCaseNo]) {
                    globalWorkOrdersByRoadCaseNo[roadCaseNo] = [];
                }

                let rawStatus = getCell(woIdxStatus);
                if (!rawStatus || rawStatus === 'null' || rawStatus === '尚未回報' || rawStatus === '') rawStatus = '未回報';

                globalWorkOrdersByRoadCaseNo[roadCaseNo].push({
                    engNo: getCell(woIdxEngNo),
                    id: getCell(woIdxId),
                    status: rawStatus,
                    loc: getCell(woIdxLoc),
                    rd1Note: rd1Note,
                    pcdNote: getCell(woIdxPcdNote)
                });
            });
        }

        // --- 1. 解析明細檔 (Detail Sheet) ---
        const detailValues = detailRes.values || [];
        globalDetailData = {};
        if (detailValues.length > 1) {
            const dHeaders = detailValues[0].map(h => h ? String(h).trim() : '');
            const getColIdx = (headers, keywords) => {
                for (let kw of keywords) {
                    const exactIdx = headers.findIndex(h => h === kw);
                    if (exactIdx !== -1) return exactIdx;
                }
                for (let kw of keywords) {
                    const includeIdx = headers.findIndex(h => h.includes(kw));
                    if (includeIdx !== -1) return includeIdx;
                } 
                return -1;
            };
            const dIdxCaseNo = getColIdx(dHeaders, ['案件編號']);
            const dIdxRecordDate = getColIdx(dHeaders, ['打卡紀錄日']);
            const dIdxCheckIn = getColIdx(dHeaders, ['進場狀態']);
            const dIdxCheckOut = getColIdx(dHeaders, ['退場狀態']);
            const dIdxWorkDate = getColIdx(dHeaders, ['施工日期']);
            const dIdxNote = getColIdx(dHeaders, ['備註']);

            detailValues.slice(1).forEach(row => {
                const getCell = (idx) => (idx !== -1 && idx < row.length && row[idx] !== undefined) ? String(row[idx]).trim() : '';
                const getCleanCell = (idx) => {
                    const val = getCell(idx);
                    if (val.startsWith("=")) {
                        return parseHyperlink(val).label;
                    }
                    return val;
                };

                const caseNo = getCleanCell(dIdxCaseNo);
                if (!caseNo) return;

                if (!globalDetailData[caseNo]) {
                    globalDetailData[caseNo] = [];
                }
                globalDetailData[caseNo].push({
                    recordDate: cleanDateVal(getCell(dIdxRecordDate)),
                    checkIn: getCell(dIdxCheckIn),
                    checkOut: getCell(dIdxCheckOut),
                    workDate: cleanDateVal(getCell(dIdxWorkDate)),
                    note: getCleanCell(dIdxNote)
                });
            });

            // 對每個案件的打卡紀錄依照「打卡紀錄日」降序排序 (最新在最上面)
            for (let cNo in globalDetailData) {
                globalDetailData[cNo].sort((a, b) => b.recordDate.localeCompare(a.recordDate));
            }
        }

        // --- 2. 解析主檔 (Master Sheet) ---
        const masterValues = masterRes.values || [];
        if (masterValues.length === 0) throw new Error("主檔試算表內無任何資料。");

        const headers = masterValues[0].map(h => h ? String(h).trim() : '');
        const rows = masterValues.slice(1);

        const getColIdx = (headers, keywords) => {
            for (let kw of keywords) {
                const exactIdx = headers.findIndex(h => h === kw);
                if (exactIdx !== -1) return exactIdx;
            }
            for (let kw of keywords) {
                const includeIdx = headers.findIndex(h => h.includes(kw));
                if (includeIdx !== -1) return includeIdx;
            } 
            return -1;
        };

        const idxCaseNo = getColIdx(headers, ['案件編號']);
        const idxPurpose = getColIdx(headers, ['施工目的']);
        const idxStatus = getColIdx(headers, ['申請狀態']);
        const idxApplicant = getColIdx(headers, ['申請人']);
        const idxLocation = getColIdx(headers, ['挖掘地點']);
        const idxContractor = getColIdx(headers, ['施工廠商']);
        const idxSupervisor = getColIdx(headers, ['監工資訊']);
        const idxNote = getColIdx(headers, ['備註']);       
        const idxNote1 = getColIdx(headers, ['備註1']);     
        const idxCaseType = getColIdx(headers, ['案件類型']);
        const idxAuthUnit = getColIdx(headers, ['路權單位']);
        const idxPermitStart = getColIdx(headers, ['路證日期起']);
        const idxPermitEnd = getColIdx(headers, ['路證日期迄']);
        const idxCompReqDate = getColIdx(headers, ['完工申請日']);
        const idxManualNote = getColIdx(headers, ['手動備註']);
        const idxLocMap = getColIdx(headers, ['地點']);
        const idxDesign = getColIdx(headers, ['設計圖連結']);

        const todayDate = new Date();
        todayDate.setHours(0, 0, 0, 0); 
        const currentRocYear = todayDate.getFullYear() - 1911;

        globalData = rows.map(row => {
          const getCell = (idx) => (idx !== -1 && idx < row.length && row[idx] !== undefined) ? String(row[idx]).trim() : '';
          
          // 🚀 清洗公式型欄位為純文字值，以防公式字串干擾搜尋或標籤顯示
          const getCleanCell = (idx) => {
              const val = getCell(idx);
              if (val.startsWith("=")) {
                  return parseHyperlink(val).label;
              }
              return val;
          };

          let caseNo = getCleanCell(idxCaseNo);
          let statusVal = getCleanCell(idxStatus) || '未指派';
          let permitEndVal = cleanDateVal(getCell(idxPermitEnd));
          
          let note = getCleanCell(idxNote);
          if (note === 'NaN' || note === 'null') note = '';
          
          let note1 = getCleanCell(idxNote1);
          if (note1 === 'NaN' || note1 === 'null') note1 = '';

          let year = (caseNo && caseNo.length >= 3) ? caseNo.substring(0, 3) : '未知';

          let isExpiringSoon = false;
          let isOverdue = false;
          let isCompletedOrCanceled = statusVal.includes('完工') || statusVal.includes('退')|| statusVal.includes('已刪除') || statusVal.includes('已註銷')|| statusVal.includes('已結案')|| statusVal.includes('作廢');
          
          if (!isCompletedOrCanceled && permitEndVal) {
              let pEnd = parseTaiwanDate(permitEndVal);
              if (pEnd) {
                  let diffDays = Math.ceil((pEnd.getTime() - todayDate.getTime()) / (1000 * 3600 * 24));
                  if (diffDays < 0) isOverdue = true;               
                  else if (diffDays <= 14) isExpiringSoon = true;   
              }
          }

          return {
            caseNo: caseNo,
            year: year,
            purpose: getCleanCell(idxPurpose) || '未填寫',
            status: statusVal,
            applicant: getCleanCell(idxApplicant) || '未填寫',
            location: getCleanCell(idxLocation),
            contractor: (getCleanCell(idxContractor) || '未知').substring(0, 2),
            supervisor: getCleanCell(idxSupervisor),
            note: note,
            note1: note1,
            caseType: getCleanCell(idxCaseType) || '未分類',
            authUnit: getCleanCell(idxAuthUnit) || '未知單位',
            permitStart: cleanDateVal(getCell(idxPermitStart)),
            permitEnd: permitEndVal,
            compReqDate: cleanDateVal(getCell(idxCompReqDate)),
            manualNote: getCleanCell(idxManualNote),
            isExpiringSoon: isExpiringSoon, 
            isOverdue: isOverdue,
            isCompletedOrCanceled: isCompletedOrCanceled,
            locMap: getCell(idxLocMap),
            design: getCell(idxDesign)
          };
        }).filter(d => {
          if (!d.caseNo) return false;
          // 🚀 依民國年份剔除距今2年(含)以上已完工/已結案/已註銷/退件的舊案件 (例: 今年115年，剔除 113年及以前已結案的案件)
          const caseRocYear = parseInt(d.year, 10);
          if (!isNaN(caseRocYear) && d.isCompletedOrCanceled && caseRocYear <= (currentRocYear - 2)) {
            return false;
          }
          return true;
        }); 

        document.getElementById('loading-indicator').style.display = 'none';
        calculateAndRenderDashboard();
      } catch (error) {
        document.getElementById('loading-indicator').innerHTML = `❌ <b>雲端連線失敗</b>：${escapeHtml(error.message)}`;
        document.getElementById('loading-indicator').style.background = 'var(--color-background-danger)';
        document.getElementById('loading-indicator').style.color = 'var(--color-text-danger)';
      }
    }

    function setupColumnToggle() {
      const container = document.getElementById('filter-column-btns');
      container.innerHTML = '';
      
      const colCount = dataTableInstance.columns().count();
      
      for (let i = 0; i < colCount; i++) {
        let col = dataTableInstance.column(i);
        let title = col.header().textContent.trim().replace('📝 ', ''); 
        
        // 🚀 跳過展合控制列
        if (!title) continue;
        
        let btn = document.createElement('button');
        btn.className = 'filter-btn active'; 
        btn.textContent = title;
        
        btn.onclick = () => {
          let targetCol = dataTableInstance.column(i); 
          let isVisible = targetCol.visible();
          targetCol.visible(!isVisible);
          btn.classList.toggle('active', !isVisible); 
        };
        
        container.appendChild(btn);
      }
    }

    // 🚀 新增：負責更新路權單位圖表的獨立函數

      const selectedYear = document.getElementById('local-auth-year').value;
      
      let chartData = globalData;
      if (selectedYear !== 'all') {
          chartData = globalData.filter(d => d.year === selectedYear);
      }
      
      const authMap = {}; 
      chartData.forEach(d => { authMap[d.authUnit] = (authMap[d.authUnit] || 0) + 1; });
      const authSortedFull = Object.entries(authMap).sort((a, b) => b[1] - a[1]);
      const authSortedChart = authSortedFull.slice(0, 10);

    function calculateAndRenderDashboard() {
      setupFilterControlLogic();

      let activeCount = 0, compCount = 0, errCount = 0;
      let expCount = 0, ovdCount = 0, normCount = 0; 

      globalData.forEach(d => {
        const s = d.status;
        if(s.includes('完工')) compCount++;
        else if(s.includes('退件') || s.includes('退回') || s.includes('停工')) errCount++;
        else if(s.includes('核准') || s.includes('發證') || s.includes('同意') || s.includes('施工中')) activeCount++;
        
        if (d.isOverdue) ovdCount++;
        else if (d.isExpiringSoon) expCount++;
        else normCount++;
      });

      document.getElementById('m-total').innerText = globalData.length.toLocaleString();
      document.getElementById('m-active').innerText = activeCount.toLocaleString();
      document.getElementById('m-completed').innerText = compCount.toLocaleString();
      document.getElementById('m-error').innerText = errCount.toLocaleString();

      let woIncompleteCount = 0, woCompleteCount = 0;
      globalData.forEach(d => {
        const wos = globalWorkOrdersByRoadCaseNo[d.caseNo] || [];
        if (wos.length > 0) {
          if (wos.some(wo => !(wo.status || '').includes('已完工'))) woIncompleteCount++;
          else woCompleteCount++;
        }
      });

      const alertEl = document.getElementById('filter-alert-btns');
      alertEl.innerHTML = `
          <button class="filter-btn active" data-alert="all">全部案件</button>
          <button class="filter-btn" data-alert="overdue" style="color:var(--color-text-danger);">❌ 已逾期 (${ovdCount})</button>
          <button class="filter-btn" data-alert="expiringSoon" style="color:#d97a0d;">⚠️ 即將逾期 (${expCount})</button>
          <button class="filter-btn" data-alert="normal">✅ 狀態正常 (${normCount})</button>
          <button class="filter-btn" data-alert="woIncomplete" style="color:var(--color-text-danger);">🚨 工作單未完工 (${woIncompleteCount})</button>
          <button class="filter-btn" data-alert="woCompleted" style="color:#d97a0d;">🟡 工作單已完工 (${woCompleteCount})</button>
      `;

      const typeMap = {}; globalData.forEach(d => { typeMap[d.caseType] = (typeMap[d.caseType] || 0) + 1; });
      const typeSorted = Object.entries(typeMap).sort((a, b) => b[1] - a[1]);
      renderBars('type-bars', typeSorted, '#0b66c2', 'type');

      const conMap = {}; globalData.forEach(d => { conMap[d.contractor] = (conMap[d.contractor] || 0) + 1; });
      const conSorted = Object.entries(conMap).sort((a, b) => b[1] - a[1]);
      const conBarsEl = document.getElementById('contractor-bars'); 
      conBarsEl.style.display = 'grid'; conBarsEl.style.gridTemplateColumns = 'repeat(auto-fit, minmax(280px, 1fr))'; conBarsEl.style.gap = '8px';
      const maxCon = conSorted[0] ? conSorted[0][1] : 1;
      conBarsEl.innerHTML = conSorted.map(([name, count]) => {
        const pct = (count / maxCon) * 100;
        const safeName = escapeHtml(name);
        return `<div class="bar-row" data-contractor="${safeName}" style="background:var(--color-background-secondary); padding: 8px; border-radius:6px; border:1px solid var(--color-border-secondary); width:100%;"><span class="bar-label" style="width:100px;">${safeName}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#7F77DD"></div></div><span class="bar-count">${count} 件</span></div>`;
      }).join('');

      // 產生所有年份的選單 (供全域篩選與圖表獨立篩選用)
      const yearMap = {}; globalData.forEach(d => { yearMap[d.year] = (yearMap[d.year] || 0) + 1; });
      const yearSorted = Object.entries(yearMap).sort((a, b) => b[0].localeCompare(a[0]));

      // 🚀 綁定路權單位卡片的下拉選單
      const authYearSelect = document.getElementById('local-auth-year');
      authYearSelect.innerHTML = '<option value="all">歷年總計</option>' + yearSorted
        .filter(([y]) => y !== '未知')
        .map(([y]) => `<option value="${escapeHtml(y)}">${escapeHtml(y)}年</option>`).join('');
      // 初始化呼叫繪製路權單位圖表
      updateAuthChart();

      const purposeMap = {}; globalData.forEach(d => { purposeMap[d.purpose] = (purposeMap[d.purpose] || 0) + 1; });
      const purposeSorted = Object.entries(purposeMap).sort((a, b) => b[1] - a[1]);

      const applicantMap = {}; globalData.forEach(d => { applicantMap[d.applicant] = (applicantMap[d.applicant] || 0) + 1; });
      const applicantSorted = Object.entries(applicantMap).sort((a, b) => b[1] - a[1]);

      const statusMap = {}; globalData.forEach(d => { statusMap[d.status] = (statusMap[d.status] || 0) + 1; });
      const statusSorted = Object.entries(statusMap).sort((a, b) => b[1] - a[1]);
      
      generateFilterButtons('filter-year-btns', yearSorted, 'year', '全部年份');
      generateFilterButtons('filter-type-btns', typeSorted, 'type', '全部類型');
      generateFilterButtons('filter-purpose-btns', purposeSorted, 'purpose', '全部目的'); 
      
      // 全域篩選按鈕仍需顯示所有單位
      const allAuthMap = {}; globalData.forEach(d => { allAuthMap[d.authUnit] = (allAuthMap[d.authUnit] || 0) + 1; });
      const allAuthSorted = Object.entries(allAuthMap).sort((a, b) => b[1] - a[1]);
      generateFilterButtons('filter-auth-btns', allAuthSorted, 'auth', '全部單位');
      
      generateFilterButtons('filter-contractor-btns', conSorted, 'contractor', '全部廠商');
      generateFilterButtons('filter-applicant-btns', applicantSorted, 'applicant', '全部申請人');
      generateFilterButtons('filter-status-btns', statusSorted, 'status', '全部狀態');

      renderTable();
    }

    function renderBars(elementId, dataSorted, color, dataSetKey) {
        const el = document.getElementById(elementId);
        const max = dataSorted[0] ? dataSorted[0][1] : 1;
        el.innerHTML = dataSorted.map(([name, count]) => {
          const pct = (count / max) * 100;
          const safeName = escapeHtml(name);
          return `<div class="bar-row" data-${dataSetKey}="${safeName}"><span class="bar-label" title="${safeName}">${safeName}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="bar-count">${count}</span></div>`;
        }).join('');
    }

    function generateFilterButtons(elementId, dataSorted, dataSetKey, allText) {
        const el = document.getElementById(elementId);
        const buttons = dataSorted.map(([name, count]) => {
            let label = dataSetKey === 'year' && name !== '未知' ? `${name}年 (${count})` : `${name} (${count})`;
            return `<button class="filter-btn" data-${dataSetKey}="${escapeHtml(name)}">${escapeHtml(label)}</button>`;
        });
        el.innerHTML = `<button class="filter-btn active" data-${dataSetKey}="all">${escapeHtml(allText)}</button>${buttons.join('')}`;
    }

    function setupFilterControlLogic() {
      if (filtersBound) return;
      filtersBound = true;
      document.getElementById('btn-export-excel-summary').addEventListener('click', exportFilteredTableToExcelSummary);
      document.getElementById('btn-export-excel-detail').addEventListener('click', exportFilteredTableToExcelDetail);

      // 🚀 監聽獨立年度下拉選單
      document.getElementById('local-auth-year').addEventListener('change', updateAuthChart);

      ['type', 'auth', 'contractor'].forEach(id => {
        document.getElementById(`btn-toggle-${id}`).addEventListener('click', e => {
          const el = document.getElementById(`${id}-bars`); const btn = e.target;
          if (el.classList.contains('hide-board-engine')) { el.classList.remove('hide-board-engine'); btn.textContent = `📊 隱藏`; btn.classList.remove('active'); } 
          else { el.classList.add('hide-board-engine'); btn.textContent = `📊 顯示`; btn.classList.add('active'); }
        });
      });

      document.getElementById('txt-search').addEventListener('input', e => {
        clearTimeout(searchDebounceTimer);
        const value = e.target.value;
        searchDebounceTimer = setTimeout(() => {
          textSearchQuery = value.toLowerCase().trim();
          renderTable();
        }, 200);
      });

      const bindFilterClick = (containerId, dataKey, setObj) => {
        const container = document.getElementById(containerId);
        if(container) {
          container.addEventListener('click', e => {
            const item = e.target.closest('.bar-row, .filter-btn'); if (!item) return;
            const target = item.dataset[dataKey];
            if (target === 'all') setObj.clear();
            else { if (setObj.has(target)) setObj.delete(target); else setObj.add(target); }
            renderTable();
          });
        }
      };

      bindFilterClick('type-bars', 'type', selectedTypes);
      bindFilterClick('auth-bars', 'auth', selectedAuths);
      bindFilterClick('contractor-bars', 'contractor', selectedContractors);
      
      bindFilterClick('filter-alert-btns', 'alert', selectedAlerts); 
      bindFilterClick('filter-year-btns', 'year', selectedYears); 
      bindFilterClick('filter-type-btns', 'type', selectedTypes);
      bindFilterClick('filter-purpose-btns', 'purpose', selectedPurposes); 
      bindFilterClick('filter-auth-btns', 'auth', selectedAuths);
      bindFilterClick('filter-contractor-btns', 'contractor', selectedContractors);
      bindFilterClick('filter-applicant-btns', 'applicant', selectedApplicants);
      bindFilterClick('filter-status-btns', 'status', selectedStatuses);
    }

    async function saveManualNote(caseNo) {
      const noteInput = document.getElementById(`note-${caseNo}`);
      const saveBtn = document.getElementById(`save-btn-${caseNo}`);
      if (!noteInput) return;
      const noteValue = noteInput.value.trim();
      saveBtn.innerText = "⏳ 寫入"; saveBtn.disabled = true;
      try {
        const fetchUrl = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(caseNo)}&note=${encodeURIComponent(noteValue)}`;
        const response = await fetch(fetchUrl);
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        const text = await response.text();
        let resJson;
        try {
          resJson = JSON.parse(text);
        } catch (e) {
          throw new Error("試算表回傳格式錯誤。這通常是因為 Google Apps Script 未正確部署為「任何人 (Anyone)」，導致存取被拒並導向了登入畫面，請檢查 Apps Script 的部署權限設定。");
        }
        if (resJson.status === 'success') {
          saveBtn.innerText = "✅ 成功"; saveBtn.style.background = "var(--color-background-success)"; saveBtn.style.color = "var(--color-text-success)";
          const targetObj = globalData.find(d => d.caseNo === caseNo); if (targetObj) targetObj.manualNote = noteValue;
          setTimeout(() => { saveBtn.innerText = "儲存"; saveBtn.style.background = "var(--color-background-info)"; saveBtn.style.color = "var(--color-text-info)"; saveBtn.disabled = false; }, 1200);
        } else { alert("寫入失敗：" + resJson.message); saveBtn.innerText = "儲存"; saveBtn.disabled = false; }
      } catch (err) { alert("網路連線失敗：" + err.message); saveBtn.innerText = "儲存"; saveBtn.disabled = false; }
    }

    function syncFilterUIStyles() {
      const syncUI = (containerId, dataKey, setObj) => {
        document.querySelectorAll(`#${containerId} .bar-row, #${containerId} .filter-btn`).forEach(el => {
          const val = el.dataset[dataKey];
          if (val === 'all') el.classList.toggle('active', setObj.size === 0);
          else el.classList.toggle('active', setObj.has(val));
        });
      };
      syncUI('type-bars', 'type', selectedTypes);
      syncUI('auth-bars', 'auth', selectedAuths);
      syncUI('contractor-bars', 'contractor', selectedContractors);
      
      syncUI('filter-alert-btns', 'alert', selectedAlerts);
      syncUI('filter-year-btns', 'year', selectedYears); 
      syncUI('filter-type-btns', 'type', selectedTypes);
      syncUI('filter-purpose-btns', 'purpose', selectedPurposes);
      syncUI('filter-auth-btns', 'auth', selectedAuths);
      syncUI('filter-contractor-btns', 'contractor', selectedContractors);
      syncUI('filter-applicant-btns', 'applicant', selectedApplicants);
      syncUI('filter-status-btns', 'status', selectedStatuses);
    }

    function renderTable() {
      syncFilterUIStyles();

      currentFilteredData = globalData.filter(d => {
        const workOrders = globalWorkOrdersByRoadCaseNo[d.caseNo] || [];
        const woSearchText = workOrders.map(w => `${w.id} ${w.engNo} ${w.status} ${w.loc} ${w.rd1Note} ${w.pcdNote}`).join(' ');
        const hasManualNoteText = (d.manualNote && String(d.manualNote).trim() !== "") ? "已備註 有備註" : "";
        const matchesText = (textSearchQuery === '') ||
          Object.values(d).some(v => String(v).toLowerCase().includes(textSearchQuery)) ||
          woSearchText.toLowerCase().includes(textSearchQuery) ||
          hasManualNoteText.includes(textSearchQuery);

        const hasWorkOrders = workOrders.length > 0;
        const isWoIncomplete = hasWorkOrders && workOrders.some(wo => !(wo.status || '').includes('已完工'));
        const isWoCompleted = hasWorkOrders && !workOrders.some(wo => !(wo.status || '').includes('已完工'));

        const matchesAlert = (selectedAlerts.size === 0) ||
          (selectedAlerts.has('overdue') && d.isOverdue) ||
          (selectedAlerts.has('expiringSoon') && d.isExpiringSoon) ||
          (selectedAlerts.has('normal') && !d.isOverdue && !d.isExpiringSoon) ||
          (selectedAlerts.has('woIncomplete') && isWoIncomplete) ||
          (selectedAlerts.has('woCompleted') && isWoCompleted);

        const matchesYear = (selectedYears.size === 0) || selectedYears.has(d.year);
        const matchesType = (selectedTypes.size === 0) || selectedTypes.has(d.caseType);
        const matchesPurpose = (selectedPurposes.size === 0) || selectedPurposes.has(d.purpose); 
        const matchesContractor = (selectedContractors.size === 0) || selectedContractors.has(d.contractor);
        const matchesAuth = (selectedAuths.size === 0) || selectedAuths.has(d.authUnit);
        const matchesApplicant = (selectedApplicants.size === 0) || selectedApplicants.has(d.applicant);
        const matchesStatus = (selectedStatuses.size === 0) || selectedStatuses.has(d.status);

        return matchesText && matchesAlert && matchesYear && matchesType && matchesPurpose && matchesContractor && matchesAuth && matchesApplicant && matchesStatus;
      });

      // 🚀 預設依「打卡紀錄日」遞減排序 (有打卡紀錄日者排在最前面，無打卡紀錄者排在後面)
      currentFilteredData.sort((a, b) => {
        const aDetails = globalDetailData[a.caseNo] || [];
        const bDetails = globalDetailData[b.caseNo] || [];
        const aDate = (aDetails.length > 0 && aDetails[0].recordDate) ? aDetails[0].recordDate : '';
        const bDate = (bDetails.length > 0 && bDetails[0].recordDate) ? bDetails[0].recordDate : '';
        
        if (aDate && bDate) return bDate.localeCompare(aDate);
        if (aDate && !bDate) return -1;
        if (!aDate && bDate) return 1;
        return 0;
      });

      document.getElementById('filter-count').innerText = `${currentFilteredData.length.toLocaleString()} 件`;

      const mappedData = currentFilteredData.map(d => {
        let permitEndHtml = `<span style="font-family:monospace;font-size:13px;color:var(--color-text-secondary);">${escapeHtml(d.permitEnd || '')}</span>`;
        if (d.isOverdue) {
            permitEndHtml += `<br><span style="font-size:11px; font-weight:bold; color:#fff; background:var(--color-text-danger); padding:2px 4px; border-radius:4px; display:inline-block; margin-top:2px;">❌ 已逾期</span>`;
        } else if (d.isExpiringSoon) {
            permitEndHtml += `<br><span style="font-size:11px; font-weight:bold; color:#d97a0d; background:var(--color-background-warning); border:1px solid #ffd54f; padding:2px 4px; border-radius:4px; display:inline-block; margin-top:2px;">⚠️ 即將逾期</span>`;
        }

        // 歷史打卡明細資料
        const details = globalDetailData[d.caseNo] || [];
        let historyHtml = '';
        if (details.length > 0) {
            historyHtml = `<span class="tag" style="background:#e8f5e9; color:#1e8e3e; border:1px solid #c8e6c9; font-weight:600;">🏷️ 已打卡 ${details.length} 次</span>`;
        } else {
            historyHtml = `<span style="color:var(--color-text-tertiary); font-size:12px;">無紀錄</span>`;
        }

        let latestRecordDateHtml = '';
        if (details.length > 0 && details[0].recordDate) {
            latestRecordDateHtml = `<span style="font-family:monospace;font-size:13px;color:var(--color-text-primary); font-weight:500;">${escapeHtml(details[0].recordDate)}</span>`;
        } else {
            latestRecordDateHtml = `<span style="color:var(--color-text-tertiary); font-size:12px;">無紀錄</span>`;
        }

        // 解析地點與設計圖 (來自主檔)
        const parsedLoc = parseHyperlink(d.locMap);
        let locationHtml = `<span style="font-size:13px;color:var(--color-text-primary);" title="${escapeHtml(d.location || '')}">${escapeHtml(d.location || '')}</span>`;
        const safeMapUrl = safeUrl(parsedLoc.url);
        if (safeMapUrl) {
            locationHtml += ` <a href="${escapeHtml(safeMapUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none; margin-left:6px;" title="查看地圖">🗺️</a>`;
        }

        const parsedDesign = parseHyperlink(d.design);
        let designUrl = parsedDesign.url;
        if (!designUrl && d.design && (d.design.startsWith('http://') || d.design.startsWith('https://'))) {
            designUrl = d.design;
        }
        if (!designUrl && d.caseNo) {
            designUrl = `https://pwd.yunlin.gov.tw/YLPipe/NewApp/CaseShow?AppNo=${encodeURIComponent(d.caseNo)}&FolderName=DesignPic`;
        }

        let designHtml = '';
        designUrl = safeUrl(designUrl);
        if (designUrl) {
            designHtml = `<a href="${escapeHtml(designUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;"><span class="tag" style="background:#e3f2fd; color:#0b66c2; border:1px solid #bbdefb;">📐 查看設計圖</span></a>`;
        } else {
            designHtml = `<span style="color:var(--color-text-tertiary); font-size:12px;">無</span>`;
        }

        // 關聯工作單明細顏色高亮
        const workOrders = globalWorkOrdersByRoadCaseNo[d.caseNo] || [];
        let caseNoStyle = 'font-family:monospace;font-size:14px;font-weight:700;color:var(--color-text-info);';
        let caseNoTitle = '';

        if (workOrders.length > 0) {
            // 只要有任意一筆工作單的回報狀態「不是已完工」（如未完工、未回報、施工中等），即顯示淡紅色警示底色；全數為已完工時才顯示黃色底色
            const hasIncomplete = workOrders.some(wo => !(wo.status || '').includes('已完工'));
            if (hasIncomplete) {
                // 有非「已完工」的工作單：改用淡紅色警示底色 (顯眼區分)
                caseNoStyle += ' background:#ffebee; color:#c5221f; padding:3px 6px; border-radius:4px; border:1px solid #ffcdd2;';
                caseNoTitle = `關聯工作單含有未完工/未完成項目 (共 ${workOrders.length} 筆)`;
            } else {
                // 所有工作單皆為「已完工」：顯示黃色底色
                caseNoStyle += ' background:#fff8e1; color:#b78103; padding:3px 6px; border-radius:4px; border:1px solid #ffe082;';
                caseNoTitle = `關聯工作單已全數完工 (共 ${workOrders.length} 筆)`;
            }
        }

        return {
          caseNoRaw: d.caseNo, // 🚀 原始案件編號 (供 formatChildRow 使用)
          caseNo: `<span style="${caseNoStyle}" title="${escapeHtml(caseNoTitle)}">${escapeHtml(d.caseNo || '')}</span>`,
          status: `<div style="text-align:center;">${statusTag(d.status || '', d.isExpiringSoon, d.isOverdue)}</div>`,
          history: historyHtml,
          checkInDate: latestRecordDateHtml,
          design: designHtml,
          caseType: `<span style="font-size:13px;">${escapeHtml(d.caseType || '')}</span>`,
          purpose: `<span style="font-size:13px;color:var(--color-text-secondary);" title="${escapeHtml(d.purpose || '')}">${escapeHtml(d.purpose || '')}</span>`,
          authUnit: `<span style="font-size:13px; font-weight:500;">${escapeHtml(d.authUnit || '')}</span>`,
          contractor: `<span style="font-size:13px; font-weight:500; color:#5e6c84">${escapeHtml(d.contractor || '')}</span>`,
          applicant: `<span style="font-size:13px;">${escapeHtml(d.applicant || '')}</span>`,
          permitStart: `<span style="font-family:monospace;font-size:13px;color:var(--color-text-secondary);">${escapeHtml(d.permitStart || '')}</span>`,
          permitEnd: permitEndHtml, 
          compReqDate: `<span style="font-family:monospace;font-size:13px;color:var(--color-text-secondary);">${escapeHtml(d.compReqDate || '')}</span>`,
          location: locationHtml,
          supervisor: `<span style="font-size:13px;color:var(--color-text-tertiary);" title="${escapeHtml(d.supervisor || '')}">${escapeHtml(d.supervisor || '')}</span>`,
          note: `<span style="font-size:13px;color:var(--color-text-tertiary);" title="${escapeHtml(d.note || '')}">${escapeHtml(d.note || '')}</span>`,
          note1: `<span style="font-size:13px;color:var(--color-text-tertiary);" title="${escapeHtml(d.note1 || '')}">${escapeHtml(d.note1 || '')}</span>`,
          manualNote: `
            <div style="display:flex; align-items:center;">
              <input type="text" id="note-${escapeHtml(d.caseNo)}" class="note-input" value="${escapeHtml(d.manualNote || '')}" placeholder="點擊鍵入備註...">
              <button id="save-btn-${escapeHtml(d.caseNo)}" class="note-save-btn" data-action="save-note" data-case-no="${escapeHtml(d.caseNo)}">儲存</button>
            </div>
          `
        };
      });

      if (!dataTableInstance) {
        initDataTable();
      }
      
      dataTableInstance.clear().rows.add(mappedData).draw();
    }

    function statusTag(s, isExpiringSoon, isOverdue) {
      let tagHtml = '';
      if (s.includes('完工')) tagHtml = `<span class="tag" style="background:var(--color-background-success);color:var(--color-text-success); border: 1px solid var(--color-border-success)">${s}</span>`;
      else if (s.includes('退件') || s.includes('退回') || s.includes('停工') || s.includes('作廢')) tagHtml = `<span class="tag" style="background:var(--color-background-danger); color:var(--color-text-danger); border: 1px solid var(--color-text-danger)">${s}</span>`;
      else if (s.includes('發證') || s.includes('核准') || s.includes('同意') || s.includes('施工中')) tagHtml = `<span class="tag" style="background:var(--color-background-info); color:var(--color-text-info); border: 1px solid var(--color-text-info)">${s}</span>`;
      else tagHtml = `<span class="tag" style="background:var(--color-background-secondary);color:var(--color-text-secondary); border: 1px solid var(--color-border-secondary);">${s}</span>`;
      
      // if (isOverdue) tagHtml += `<div style="margin-top:4px;"><span class="tag" style="background:var(--color-text-danger); color:#fff; font-size:10px; border:none;">❌ 逾期</span></div>`;
      // else if (isExpiringSoon) tagHtml += `<div style="margin-top:4px;"><span class="tag" style="background:var(--color-background-warning); color:#d97a0d; border: 1px solid #ffd54f; font-size:10px;">⚠️ 逾期警告</span></div>`;
      
      return tagHtml;
    }

    // 🚀 方式一：原本的「案件總覽」Excel 匯出 (同一案件之工作單單一儲存格合併呈現)
    function exportFilteredTableToExcelSummary() {
      if (!currentFilteredData || currentFilteredData.length === 0) { 
        alert("目前沒有任何數據可以導出！"); 
        return; 
      }
      
      const headers = ["案件編號", "申請狀態", "關聯工作單數", "關聯工作單號", "打卡次數", "最新進場狀態", "最新退場狀態", "打卡紀錄日", "設計圖連結", "案件類型", "施工目的", "路權單位", "施工廠商", "申請人", "路證日期起", "路證日期迄", "完工申請日", "挖掘地點", "地圖連結", "監工資訊", "備註", "備註1", "手動備註"];
      const dataAOA = [headers];

      currentFilteredData.forEach(d => {
        let exportStatus = d.status;
        if (d.isOverdue) exportStatus += ' [❌已逾期]';
        else if (d.isExpiringSoon) exportStatus += ' [⚠️即將逾期]';

        const workOrders = globalWorkOrdersByRoadCaseNo[d.caseNo] || [];
        const woIds = workOrders.map(w => w.id || w.engNo).join(', ');

        const details = globalDetailData[d.caseNo] || [];
        const latest = details[0] || {};
        const parsedIn = parseHyperlink(latest.checkIn || '');
        const parsedOut = parseHyperlink(latest.checkOut || '');
        const parsedDesign = parseHyperlink(d.design);
        let designUrl = parsedDesign.url;
        if (!designUrl && d.design && (d.design.startsWith('http://') || d.design.startsWith('https://'))) {
            designUrl = d.design;
        }
        if (!designUrl && d.caseNo) {
            designUrl = `https://pwd.yunlin.gov.tw/YLPipe/NewApp/CaseShow?AppNo=${encodeURIComponent(d.caseNo)}&FolderName=DesignPic`;
        }
        const parsedLoc = parseHyperlink(d.locMap);

        const rowData = [
          d.caseNo, exportStatus, workOrders.length, woIds, details.length, parsedIn.label, parsedOut.label, latest.recordDate || '', designUrl,
          d.caseType, d.purpose, d.authUnit, d.contractor, d.applicant,
          d.permitStart, d.permitEnd, d.compReqDate, d.location, parsedLoc.url,
          d.supervisor, d.note, d.note1, d.manualNote
        ];
        dataAOA.push(rowData);
      });

      const today = new Date(); 
      const yyyy = today.getFullYear(); 
      const mm = String(today.getMonth() + 1).padStart(2, '0'); 
      const dd = String(today.getDate()).padStart(2, '0');
      const filename = `路權挖掘案件_案件總覽報表_${yyyy}${mm}${dd}.xlsx`;

      try {
        const ws = XLSX.utils.aoa_to_sheet(dataAOA);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "案件總覽");
        XLSX.writeFile(wb, filename);
      } catch (err) {
        alert("匯出 Excel 時發生錯誤：" + err.message);
      }
    }

    // 🚀 方式二：全新的「工作單拆列明細」Excel 匯出 (依路權編號與工作單流水號排序，每筆工作單獨立展開一列)
    function exportFilteredTableToExcelDetail() {
      if (!currentFilteredData || currentFilteredData.length === 0) { 
        alert("目前沒有任何數據可以導出！"); 
        return; 
      }
      
      const headers = [
        "案件編號", "申請狀態", 
        "工作單流水號", "工程編號", "回報狀態", "施工地點", "PCD施工備註", "關聯工作單數", 
        "打卡次數", "最新進場狀態", "最新退場狀態", "打卡紀錄日", "設計圖連結", 
        "案件類型", "施工目的", "路權單位", "施工廠商", "申請人", 
        "路證日期起", "路證日期迄", "完工申請日", "挖掘地點", "地圖連結", 
        "監工資訊", "備註", "備註1", "手動備註"
      ];
      const dataAOA = [headers];

      // 依路權編號 (案件編號) 排序
      const sortedData = [...currentFilteredData].sort((a, b) => (a.caseNo || '').localeCompare(b.caseNo || ''));

      sortedData.forEach(d => {
        let exportStatus = d.status;
        if (d.isOverdue) exportStatus += ' [❌已逾期]';
        else if (d.isExpiringSoon) exportStatus += ' [⚠️即將逾期]';

        const rawWorkOrders = globalWorkOrdersByRoadCaseNo[d.caseNo] || [];
        // 依工作單流水號/工程編號排序
        const workOrders = [...rawWorkOrders].sort((a, b) => {
          const aId = a.id || a.engNo || '';
          const bId = b.id || b.engNo || '';
          return aId.localeCompare(bId);
        });

        const details = globalDetailData[d.caseNo] || [];
        const latest = details[0] || {};
        const parsedIn = parseHyperlink(latest.checkIn || '');
        const parsedOut = parseHyperlink(latest.checkOut || '');
        const parsedDesign = parseHyperlink(d.design);
        let designUrl = parsedDesign.url;
        if (!designUrl && d.design && (d.design.startsWith('http://') || d.design.startsWith('https://'))) {
            designUrl = d.design;
        }
        if (!designUrl && d.caseNo) {
            designUrl = `https://pwd.yunlin.gov.tw/YLPipe/NewApp/CaseShow?AppNo=${encodeURIComponent(d.caseNo)}&FolderName=DesignPic`;
        }
        const parsedLoc = parseHyperlink(d.locMap);

        const baseCaseData = [
          details.length, parsedIn.label, parsedOut.label, latest.recordDate || '', designUrl,
          d.caseType, d.purpose, d.authUnit, d.contractor, d.applicant,
          d.permitStart, d.permitEnd, d.compReqDate, d.location, parsedLoc.url,
          d.supervisor, d.note, d.note1, d.manualNote
        ];

        if (workOrders.length > 0) {
          workOrders.forEach(wo => {
            const rowData = [
              d.caseNo, exportStatus,
              wo.id || '', wo.engNo || '', wo.status || '', wo.loc || '', wo.pcdNote || '', workOrders.length,
              ...baseCaseData
            ];
            dataAOA.push(rowData);
          });
        } else {
          const rowData = [
            d.caseNo, exportStatus,
            '', '', '', '', '', 0,
            ...baseCaseData
          ];
          dataAOA.push(rowData);
        }
      });

      const today = new Date(); 
      const yyyy = today.getFullYear(); 
      const mm = String(today.getMonth() + 1).padStart(2, '0'); 
      const dd = String(today.getDate()).padStart(2, '0');
      const filename = `路權挖掘案件_工作單拆列明細報表_${yyyy}${mm}${dd}.xlsx`;

      try {
        const ws = XLSX.utils.aoa_to_sheet(dataAOA);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "工作單明細");
        XLSX.writeFile(wb, filename);
      } catch (err) {
        alert("匯出 Excel 時發生錯誤：" + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchCloudSheetsData);
  </script>
